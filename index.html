<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Tạo Code Trợ Tâm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,sans-serif;
  background:#0f1420;
  color:#e0e6f0;
  min-height:100vh;
  padding:16px;
}
.wrap{max-width:1200px;margin:0 auto}

h1{
  text-align:center;
  font-size:1.5em;
  font-weight:300;
  letter-spacing:3px;
  background:linear-gradient(90deg,#6dd5ed,#a8edea,#f5a9d0);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin-bottom:4px;
}
.tag{
  text-align:center;
  font-size:.78em;
  color:#6a7a94;
  letter-spacing:1px;
  margin-bottom:16px;
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}
@media(min-width:900px){
  .grid{grid-template-columns:1fr 1fr}
}

/* ===== PANEL ===== */
.panel{
  background:#171d2b;
  border-radius:14px;
  border:1px solid #232b3d;
  overflow:hidden;
}
.panel-title{
  padding:12px 16px;
  background:#131927;
  border-bottom:1px solid #232b3d;
  font-size:.78em;
  color:#6a7a94;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

/* ===== NÚT CHỌN LOẠI ===== */
.types{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:14px;
}
@media(min-width:500px){
  .types{grid-template-columns:1fr 1fr}
}
.type-btn{
  padding:14px 12px;
  background:#1e2637;
  color:#a8b5cc;
  border:1.5px solid #2d3a52;
  border-radius:12px;
  cursor:pointer;
  font-size:.88em;
  font-weight:500;
  letter-spacing:.5px;
  transition:.2s;
  text-align:center;
  font-family:inherit;
}
.type-btn:hover{
  background:#2a3450;
  color:#fff;
  transform:translateY(-2px);
  border-color:#3d4a62;
}
.type-btn:active{transform:translateY(0)}
.type-btn.active{
  background:linear-gradient(135deg,#1e3a4d,#2a4a5e);
  color:#6dd5ed;
  border-color:#6dd5ed;
  box-shadow:0 0 20px rgba(109,213,237,.2);
}
.type-btn .icon{
  display:block;
  font-size:1.4em;
  margin-bottom:4px;
  opacity:.9;
}

/* ===== INPUTS ===== */
.inputs{
  padding:14px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.field label{
  display:block;
  font-size:.68em;
  color:#6a7a94;
  margin-bottom:5px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.field input,
.field textarea{
  width:100%;
  padding:9px 12px;
  background:#0f1420;
  border:1px solid #2d3a52;
  border-radius:8px;
  color:#e0e6f0;
  font-size:.86em;
  font-family:inherit;
  outline:none;
  transition:.2s;
}
.field input:focus,
.field textarea:focus{
  border-color:#6dd5ed;
  box-shadow:0 0 0 3px rgba(109,213,237,.15);
}
.field.full{grid-column:1/-1}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.field input[type=color]{
  padding:4px;
  height:40px;
  cursor:pointer;
}

/* ===== TOOLBAR NÚT HÀNH ĐỘNG ===== */
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:0 14px 14px;
}
@media(min-width:500px){
  .actions{grid-template-columns:1fr 1fr 1fr 1fr}
}
.act{
  padding:12px 10px;
  font-size:.82em;
  font-weight:600;
  letter-spacing:.5px;
  border-radius:10px;
  cursor:pointer;
  border:none;
  transition:.2s;
  font-family:inherit;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.act .icon{
  font-size:1.3em;
}
.act.copy{
  background:#1e2637;
  color:#a8b5cc;
  border:1.5px solid #2d3a52;
}
.act.copy:hover{background:#2a3450;color:#fff}

.act.random{
  background:#2a2540;
  color:#c4a8ff;
  border:1.5px solid #4a3d7a;
}
.act.random:hover{background:#3a3260}

.act.download{
  background:linear-gradient(135deg,#6dd5ed,#4ab8d4);
  color:#fff;
}
.act.download:hover{filter:brightness(1.1);transform:translateY(-2px)}

.act.open{
  background:linear-gradient(135deg,#4ade80,#22c55e);
  color:#0f1420;
}
.act.open:hover{filter:brightness(1.1);transform:translateY(-2px)}

/* ===== CODE OUTPUT ===== */
.code-box{
  position:relative;
}
pre{
  margin:0;
  padding:14px;
  background:#0f1420;
  color:#a8edea;
  font-family:Consolas,monospace;
  font-size:.78em;
  line-height:1.55;
  overflow:auto;
  max-height:260px;
  white-space:pre;
}
.code-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
  background:#131927;
  border-bottom:1px solid #232b3d;
  font-size:.72em;
  color:#6a7a94;
  letter-spacing:1px;
  text-transform:uppercase;
}
.code-head .size{color:#4ade80;font-weight:600}

/* ===== PREVIEW ===== */
.preview-box{
  padding:14px;
  background:#0f1420;
}
.preview-box iframe{
  width:100%;
  height:400px;
  border:1px solid #2d3a52;
  border-radius:10px;
  background:#fff;
}

/* ===== TOAST ===== */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  padding:12px 26px;
  background:#4ade80;
  color:#0f1420;
  border-radius:30px;
  font-weight:700;
  font-size:.85em;
  transition:.35s;
  z-index:100;
  box-shadow:0 10px 30px rgba(74,222,128,.4);
}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="wrap">
  <h1>TRỢ TÂM</h1>
  <p class="tag">Bấm nút để tạo file HTML kéo tâm trạng lên</p>

  <div class="grid">

    <!-- ===== CỘT TRÁI: CHỌN + NHẬP ===== -->
    <div class="panel">
      <div class="panel-title">1. Chọn loại trợ tâm</div>

      <div class="types">
        <button class="type-btn active" onclick="pickType('quote', this)">
          <span class="icon">✦</span>Lời nhắc
        </button>
        <button class="type-btn" onclick="pickType('breath', this)">
          <span class="icon">◯</span>Hít thở
        </button>
        <button class="type-btn" onclick="pickType('gratitude', this)">
          <span class="icon">♥</span>Biết ơn
        </button>
        <button class="type-btn" onclick="pickType('affirm', this)">
          <span class="icon">★</span>Khẳng định
        </button>
        <button class="type-btn" onclick="pickType('mood', this)">
          <span class="icon">◐</span>Tâm trạng
        </button>
        <button class="type-btn" onclick="pickType('letter', this)">
          <span class="icon">✉</span>Thư
        </button>
        <button class="type-btn" onclick="pickType('countdown', this)">
          <span class="icon">⏱</span>Đếm ngược
        </button>
        <button class="type-btn" onclick="pickType('calm', this)">
          <span class="icon">◈</span>Tĩnh lặng
        </button>
      </div>

      <div class="panel-title">2. Chỉnh nội dung</div>
      <div class="inputs">
        <div class="field">
          <label>Tiêu đề</label>
          <input id="inTitle" value="Nhẹ Tâm" oninput="gen()">
        </div>
        <div class="field">
          <label>Cỡ chữ (px)</label>
          <input id="inSize" type="number" value="18" min="10" max="60" oninput="gen()">
        </div>
        <div class="field">
          <label>Màu chính</label>
          <input id="inColor" type="color" value="#6dd5ed" oninput="gen()">
        </div>
        <div class="field">
          <label>Màu phụ</label>
          <input id="inColor2" type="color" value="#a8edea" oninput="gen()">
        </div>
        <div class="field full">
          <label>Nội dung (mỗi dòng 1 ý)</label>
          <textarea id="inContent" oninput="gen()">Hít thở sâu, mọi chuyện rồi sẽ ổn.
Bạn mạnh mẽ hơn bạn nghĩ.
Hôm nay khó, ngày mai sẽ nhẹ hơn.
Bạn xứng đáng được hạnh phúc.
Mỗi ngày là một khởi đầu mới.</textarea>
        </div>
      </div>

      <div class="panel-title">3. Thao tác</div>
      <div class="actions">
        <button class="act random" onclick="randomColor()">
          <span class="icon">⚄</span>Màu random
        </button>
        <button class="act copy" onclick="copyCode()">
          <span class="icon">⎘</span>Copy
        </button>
        <button class="act download" onclick="downloadFile()">
          <span class="icon">⤓</span>Tải file
        </button>
        <button class="act open" onclick="openNewTab()">
          <span class="icon">↗</span>Mở tab
        </button>
      </div>
    </div>

    <!-- ===== CỘT PHẢI: CODE + PREVIEW ===== -->
    <div class="panel">
      <div class="code-head">
        <span>Code HTML</span>
        <span class="size" id="codeSize">0 B</span>
      </div>
      <div class="code-box">
        <pre id="code"></pre>
      </div>

      <div class="panel-title">Xem trước</div>
      <div class="preview-box">
        <iframe id="preview"></iframe>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast">Đã copy!</div>

<script>
/* ===== BIẾN ===== */
let type = 'quote';

/* ===== CHỌN LOẠI ===== */
function pickType(t, btn){
  type = t;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  gen();
}

/* ===== LẤY GIÁ TRỊ ===== */
const val = id => document.getElementById(id).value;

/* ===== TẠO CODE ===== */
function gen(){
  const title = val('inTitle') || 'Nhẹ Tâm';
  const c1 = val('inColor');
  const c2 = val('inColor2');
  const size = val('inSize') || 18;
  const content = val('inContent') || '';
  const lines = content.split('\n').map(l => l.trim()).filter(Boolean);

  let body = '';
  let script = '';

  /* 1. LỜI NHẮC */
  if(type === 'quote'){
    body = `
<div class="box">
  <h1>${title}</h1>
  <p class="quote" id="q">${lines[0] || 'Hít thở sâu...'}</p>
  <button onclick="next()">Lời nhắc mới</button>
</div>`;
    script = `
const list = ${JSON.stringify(lines)};
let i = 0;
function next(){
  const el = document.getElementById('q');
  el.style.opacity = 0;
  setTimeout(() => {
    i = (i + 1) % list.length;
    el.textContent = list[i];
    el.style.opacity = 1;
  }, 350);
}
setInterval(next, 12000);
`;
  }

  /* 2. HÍT THỞ */
  else if(type === 'breath'){
    body = `
<div class="box">
  <h1>${title}</h1>
  <div class="circle in" id="circle">HÍT VÀO</div>
  <p class="count" id="count">4</p>
  <p class="hint">Thở theo vòng tròn</p>
</div>`;
    script = `
let phase = 'in', t = 4;
const c = document.getElementById('circle');
const n = document.getElementById('count');
setInterval(() => {
  t--;
  n.textContent = t;
  if(t <= 0){
    if(phase === 'in'){
      phase = 'out';
      c.textContent = 'THỞ RA';
      c.classList.remove('in');
      c.classList.add('out');
    } else {
      phase = 'in';
      c.textContent = 'HÍT VÀO';
      c.classList.remove('out');
      c.classList.add('in');
    }
    t = 4;
    n.textContent = t;
  }
}, 1000);
`;
  }

  /* 3. BIẾT ƠN */
  else if(type === 'gratitude'){
    body = `
<div class="box">
  <h1>${title}</h1>
  <p class="sub">Hôm nay bạn biết ơn điều gì?</p>
  <input class="g" placeholder="1. ...">
  <input class="g" placeholder="2. ...">
  <input class="g" placeholder="3. ...">
  <button onclick="save()">Lưu lại</button>
  <p class="msg" id="msg"></p>
</div>`;
    script = `
function save(){
  const list = [...document.querySelectorAll('.g')].map(x => x.value).filter(Boolean);
  if(!list.length){ document.getElementById('msg').textContent = 'Viết ít nhất 1 điều.'; return; }
  localStorage.setItem('gratitude', JSON.stringify(list));
  document.getElementById('msg').textContent = 'Đã lưu. Hãy biết ơn mỗi ngày.';
}
const old = JSON.parse(localStorage.getItem('gratitude') || '[]');
document.querySelectorAll('.g').forEach((x, i) => { if(old[i]) x.value = old[i]; });
`;
  }

  /* 4. KHẲNG ĐỊNH */
  else if(type === 'affirm'){
   Ộ body = `
<div class="box">
  <h1>${title}</h1>
  <p class="affirm" id="a">${lines[0] || 'Tôi ổn.'}</p>
  <button onclick="change()">Đổi câu</button>
</div>`;
    script = `
const list = ${JSON.stringify(lines)};
let i = 0;
function change(){
  i = (i + 1) % list.length;
  const el = document.getElementById('a');
  el.textContent = list[i];
  el.animate(
    [{opacity:0, transform:'translateY(10px)'},{opacity:1, transform:'translateY(0)'}],
    {duration:500, easing:'ease'}
  );
}
setInterval(change, 8000);
`;
  }

  /* 5. TÂM TRẠNG */
  else if(type === 'mood'){
    body = `
<div class="box">
  <h1>${title}</h1>
  <p class="sub">Hôm nay bạn cảm thấy thế nào?</p>
  <div class="moods">
    <button class="m" data-m="Vui">Vui</button>
    <button class="m" data-m="Bình thường">Bình thường</button>
    <button class="m" data-m="Buồn">Buồn</button>
    <button class="m" data-m="Mệt">Mệt</button>
    <button class="m" data-m="Lo lắng">Lo lắng</button>
  </div>
  <textarea id="note" placeholder="Ghi chú thêm (tùy chọn)"></textarea>
  <button onclick="save()">Lưu</button>
  <p class="msg" id="msg"></p>
</div>`;
    script = `
let mood = '';
document.querySelectorAll('.m').forEach(b => {
  b.onclick = () => {
    mood = b.dataset.m;
    document.querySelectorAll('.m').forEach(x => x.style.cssText = '');
    b.style.background = '${c1}';
    b.style.color = '#fff';
  };
});
function save(){
  if(!mood){ document.getElementById('msg').textContent = 'Chọn tâm trạng trước.'; return; }
  const data = {mood, note: document.getElementById('note').value, time: new Date().toLocaleString()};
  const all = JSON.parse(localStorage.getItem('moods') || '[]');
  all.push(data);
  localStorage.setItem('moods', JSON.stringify(all));
T  document.getElementById('msg').textContent = 'Đã lưu tâm trạng.';
}
`;
  }

  /* 6. THƯ */
  else if(type === 'letter'){
    body = `
<div class="box">
  <h1>${title}</h1>
  <p class="sub">Viết cho chính mình trong tương lai</p>
  <textarea id="letter" placeholder="Gửi bạn của tương lai..."></textarea>
  <button onclick="save()">Lưu thư</button>
  <p class="msg" id="msg"></p>
</div>`;
    script = `
function save(){
  const t = document.getElementById('letter').value;
  if(!t){ document.getElementById('msg').textContent = 'Hãy viết gì đó.'; return TR; }
  localStorage.setItem('letter', JSON.stringify({text:t, time:new Date().toLocaleString()}));
  document.getElementById('msg').textContent = 'Đã lưu. Mở lại sau này nhé.';
}
const old = JSON.parse(localStorage.getItem('letter') || 'null');
if(old){
  document.getElementById('letter').value = old.text;
  document.getElementById('msg').textContent = 'Thư cũ: ' + old.time;
}
`;
  }

  /* 7. ĐẾM NGƯỢC */
  else if(type === 'countdown'){
    body = `
<div class="box">
  <h1>${title}</h1>
  <p class="sub">Đến sự kiện bạn mong chờ</p>
  <input id="date" type="date">
  <p class="big" id="days">0</p>
  <p class="hint">ngày nữa</p>
</div>`;
    script = `
const d = document.getElementById('date');
d.value = new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0];
function tick(){
  const target = new Date(d.value);
  const diff = Math.ceil((target - new Date()) / 86400000);
  document.getElementById('days').textContent = diff >= 0 ? diff : 0;
}
d.onchange = tick;
tick();
setInterval(tick, 60000);
`;
  }

  /* 8. TĨNH LẶNG */
  else if(type === 'calm'){
    body = `
<div class="box">
  <h1>${title}</h1>
  <p class="hint">Bấm vào chấm tròn 3 lần, hít thở theo</p>
  <div class="dot" id="dot"></div>
  <p class="msg" id="msg"></p>
</div>`;
    script = `
let count = 0;
const dot = document.getElementById('dot');
dot.onclick = () => {
  count++;
  dot.animate(
    [{transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(1)'}],
    {duration:700, easing:'ease'}
  );
  const m = document.getElementById('msg');
  if(count === 1) m.textContent = 'Tốt lắm, tiếp tục...';
  else if(count === 2) m.textContent = 'Thêm một lần nữa...';
  else if(count >= 3) m.textContent = 'Bạn đã làm rất tốt.';
};
`;
  }

  /* CSS CHUNG */
  const css = `
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(160deg,${c2},${c1});
  background-size:300% 300%;
  animation:bg 20s ease infinite;
  font-family:system-ui,sans-serif;
  padding:20px;
}
@keyframes bg{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.box{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(12px);
  padding:35px 25px;
  border-radius:22px;
  max-width:460px;
  width:100%;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
  text-align:center;
}
h1{
  font-size:1.5em;
  color:#3a4a5a;
  font-weight:400;
  letter-spacing:2px;
  margin-bottom:16px;
}
.sub{color:#8a9bb5;font-size:.85em;margin-bottom:14px}
.quote{
  font-size:${size}px;
  color:#3a4a5a;
  line-height:1.6;
  font-style:italic;
  min-height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .4s;
  margin-bottom:20px;
}
.affirm{
  font-size:${size * 1.15}px;
  color:${c1};
  font-weight:600;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.4s;
  margin-bottom:20px;
}
button{
  padding:12px 28px;
  font-size:.9em;
  color:#fff;
  background:linear-gradient(135deg,${c1},${c2});
  border:none;
  border-radius:40px;
  cursor:pointer;
  font-weight:600;
  letter-spacing:1px;
  transition:.25s;
  box-shadow:0 4px 14px ${c1}66;
  font-family:inherit;
}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(0)}
input, textarea{
  width:100%;
  padding:11px 14px;
  margin:6px 0;
  background:#fff;
  border:1.5px solid ${c1}55;
  border-radius:10px;
  font-size:.92em;
  font-family:inherit;
  outline:none;
  transition:.2s;
  color:#3a4a5a;
}
input:focus, textarea:focus{
  border-color:${c1};
  box-shadow:0 0 0 3px ${c1}33;
}
textarea{min-height:100px;resize:vertical;line-height:1.5}
.msg{margin-top:12px;color:${c1};font-size:.85em;font-weight:600;min-height:20px}
.hint{color:#8a9bb5;font-size:.82em;margin:10px 0}
.circle{
  width:130px;
  height:130px;
  border-radius:50%;
  background:radial-gradient(circle,${c2},${c1});
  box-shadow:0 0 40px ${c1}88;
  margin:20px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:600;
  letter-spacing:1px;
  transition:transform 4s ease-in-out,box-shadow 4s ease-in-out;
}
.circle.in{transform:scale(1.3);box-shadow:0 0 70px ${c1}cc}
.circle.out{transform:scale(0.9);box-shadow:0 0 20px ${c1}55}
.count{font-size:2.5em;font-weight:200;color:${c1};margin:10px 0}
.big{font-size:${size * 4}px;font-weight:200;color:${c1};margin:14px 0;text-shadow:0 0 30px ${c1}88}
.moods{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.m{
  padding:9px 16px;
  font-size:.85em;
  background:#f0f4f8;

/* ===== MÀU RANDOM ===== */
function randomColor(){
  const rnd = () => '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
  document.getElementById('inColor').value = rnd();
  document.getElementById('inColor2').value = rnd();
  gen();
}

/* ===== COPY ===== */
function copyCode(){
  const code = document.getElementById('code').textContent;
  navigator.clipboard.writeText(code).then(() => toast('Đã copy code!'));
}

/* ===== TẢI FILE ===== */
function downloadFile(){
  const code = document.getElementById('code').textContent;
  const blob = new Blob([code], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = type + '-' + Date.now() + '.html';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Đã tải file!');
}

/* ===== MỞ TAB MỚI ===== */
function openNewTab(){
  const code = document.getElementById('code').textContent;
  const blob = new Blob([code], {type: 'text/html'});
  window.open(URL.createObjectURL(blob), '_blank');
}

/* ===== TOAST ===== */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* ===== KHỞI ĐỘNG ===== */
gen();
</script>
